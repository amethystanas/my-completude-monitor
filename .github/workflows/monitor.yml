name: Completude Monitor

on:
  schedule:
    - cron: '*/5 * * * *'   # every 5 min (UTC); GitHub may delay runs
  workflow_dispatch:         # adds a manual "Run workflow" button

permissions:
  contents: write            # to commit seen_offers.json back

concurrency:
  group: completude-monitor  # never run two checks at the same time
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - run: pip install -r requirements.txt

      - name: Run the monitor
        env:
          COMPLETUDE_USERNAME: ${{ secrets.COMPLETUDE_USERNAME }}
          COMPLETUDE_PASSWORD: ${{ secrets.COMPLETUDE_PASSWORD }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_APP_PASSWORD: ${{ secrets.SMTP_APP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
        run: python monitor.py

      - name: Save state (seen_offers.json only — never the token)
        if: always()
        run: |
          git config user.name "completude-monitor-bot"
          git config user.email "actions@users.noreply.github.com"
          [ -f seen_offers.json ] || exit 0
          git add seen_offers.json
          if git diff --staged --quiet; then exit 0; fi
          git commit -m "Update monitor state"
          git pull --rebase
          git push
